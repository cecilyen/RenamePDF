name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.15"
          - os: macos-14
            python-version: "3.14"
          - os: macos-14
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check installed dependencies
        run: uv pip check

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Run CLI smoke tests
        run: |
          uv run python -OO RenamePDF.py --help
          uv run python -OO DedupePDF.py --help
          uv run python -OO AuditPDF.py --help
          uv run python -OO ReplacePDF.py --help
